<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TBiCUE RGB Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #F5F7F7;
      color: #333333;
    }

    h2 {
      color: #168B90;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>TBiCUE RGB Analyzer</h2>
    <p>검사 이미지 분석 시스템</p>
    <p id="status">분석 대기 중</p>
  </div>


<input type="file" id="imageInput" accept="image/*">

<h3>키트 촬영</h3>

<div style="
  position:relative;
  width:100%;
  max-width:500px;
  margin:auto;
  overflow:hidden;
  border-radius:12px;
  background:#222;
">
  

<video
  id="cameraPreview"
  autoplay
  playsinline
  muted
  style="
    display:block;
    width:100%;
    height:auto;
    background:#222;
  "
></video>

<div
  id="cameraGuide"
  style="
    position:absolute;
    left:3%;
    top:38%;
    width:94%;
    height:24%;
    border:3px dashed #168B90;
    border-radius:10px;
    box-sizing:border-box;
    pointer-events:none;
  "
></div>

</div>

<p style="text-align:center;">
  키트를 가이드라인 안에 맞춰주세요.
</p>

<button id="startCameraBtn" type="button">
  카메라 켜기
</button>
 
<button id="captureBtn" type="button">
  사진 촬영
</button>
 

  
<br><br>


<div id="imageWrapper" style="
  position:relative;
  display:none;
  width:fit-content;
  max-width:100%;
">
  <img id="preview" style="
    display:block;
    max-width:100%;
    height:auto;
  ">

  <div id="selectionBox" style="
    position:absolute;
    border:2px solid #168B90;
    box-sizing:border-box;
    pointer-events:none;
    display:none;
  "></div>
  
<div
  id="patchMarkers"
  style="
    position:absolute;
    inset:0;
    pointer-events:none;
  "
></div>

</div>


<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");

  imageInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;
    Object.keys(measurements).forEach(key => delete measurements[key]);
document.getElementById("regionResults").textContent =
  "아직 측정된 영역이 없습니다.";

    const imageURL = URL.createObjectURL(file);

preview.onload = function() {
  URL.revokeObjectURL(imageURL);

  document.getElementById("autoMeasureBtn").disabled = false;

  document.getElementById("status").textContent =
    "이미지 불러오기 완료";
};

    preview.src = imageURL;
    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    document.getElementById("status").textContent =
      "이미지 불러오기 완료";
  });
</script>



<button id="autoMeasureBtn" type="button" >
  RGB 자동 측정
</button>
  <button id="detectKitBtn" type="button">
  키트 위치 자동 인식
</button>
<p id="detectKitResult">키트 인식 대기 중</p>


<h3>측정 영역 선택</h3>

<select id="regionSelect">
  
<option value="refR">패치 - 빨강</option>
<option value="refG">패치 - 초록</option>
<option value="refB">패치 - 파랑</option>
<option value="refK">패치 - 검정</option>
<option value="refW">패치 - 흰색</option>

  <option value="esatC">ESAT-6 C선</option>
  <option value="esatT">ESAT-6 T선</option>
  <option value="esatBg">ESAT-6 배경</option>
  <option value="cfpC">CFP-10 C선</option>
  <option value="cfpT">CFP-10 T선</option>
  <option value="cfpBg">CFP-10 배경</option>
</select>

<h3>영역별 RGB 측정값</h3>
<div id="regionResults">
  아직 측정된 영역이 없습니다.
</div>

<p>사진을 클릭하면 해당 위치의 RGB 값이 표시됩니다.</p>
<p id="rgbResult">RGB: 측정 대기 중</p>

<canvas id="imageCanvas" style="display:none;"></canvas>

<script>
  const canvas = document.getElementById("imageCanvas");
  const ctx = canvas.getContext("2d");
  const measurements = {};
  const regionPositions = {};
  let detectedKit = null;

  preview.addEventListener("click", function(event) {
    const rect = preview.getBoundingClientRect();

    const x = Math.floor(
      (event.clientX - rect.left) *
      preview.naturalWidth / rect.width
    );

    const y = Math.floor(
      (event.clientY - rect.top) *
      preview.naturalHeight / rect.height
    );

    canvas.width = preview.naturalWidth;
    canvas.height = preview.naturalHeight;

    ctx.drawImage(preview, 0, 0);

   

const size = 20;

// 클릭한 위치를 중심으로 측정 영역 설정
const startX = Math.max(
  0, Math.min(x - size / 2, canvas.width - size)
);

const startY = Math.max(
  0, Math.min(y - size / 2, canvas.height - size)
);

// 측정 영역의 가로, 세로 크기
const width = Math.min(size, canvas.width);
const height = Math.min(size, canvas.height);



const selectionBox = document.getElementById("selectionBox");

const scaleX = preview.clientWidth / canvas.width;
const scaleY = preview.clientHeight / canvas.height;

selectionBox.style.left = (startX * scaleX) + "px";
selectionBox.style.top = (startY * scaleY) + "px";
selectionBox.style.width = (width * scaleX) + "px";
selectionBox.style.height = (height * scaleY) + "px";

selectionBox.style.display = "block";


// 영역 내 픽셀 데이터 가져오기
const imageData = ctx.getImageData(
  startX, startY, width, height
);

const pixels = imageData.data;

let totalR = 0;
let totalG = 0;
let totalB = 0;
let count = 0;

// 각 픽셀의 RGB 합산
for (let i = 0; i < pixels.length; i += 4) {
  totalR += pixels[i];
  totalG += pixels[i + 1];
  totalB += pixels[i + 2];
  count++;
}

// 평균 RGB 계산
const avgR = Math.round(totalR / count);
const avgG = Math.round(totalG / count);
const avgB = Math.round(totalB / count);

// 결과 표시

const region = document.getElementById("regionSelect").value;


const regionNames = {
  refR: "패치 - 빨강",
  refG: "패치 - 초록",
  refB: "패치 - 파랑",
  refK: "패치 - 검정",
  refW: "패치 - 흰색",

  esatC: "ESAT-6 C선",
  esatT: "ESAT-6 T선",
  esatBg: "ESAT-6 배경",
  cfpC: "CFP-10 C선",
  cfpT: "CFP-10 T선",
  cfpBg: "CFP-10 배경"
};

measurements[region] = {
  r: avgR,
  g: avgG,
  b: avgB
};
    regionPositions[region] = {
  x: x / canvas.width,
  y: y / canvas.height
};

function rgbDifference(a, b) {
  return Math.sqrt(
    (a.r - b.r) ** 2 +
    (a.g - b.g) ** 2 +
    (a.b - b.b) ** 2
  ).toFixed(2);
}

let differenceText = "";

if (measurements.esatC && measurements.esatBg) {
  differenceText +=
    `<p>ESAT-6 C선과 배경 RGB 차이: ${
      rgbDifference(measurements.esatC, measurements.esatBg)
    }</p>`;
}

if (measurements.cfpC && measurements.cfpBg) {
  differenceText +=
    `<p>CFP-10 C선과 배경 RGB 차이: ${
      rgbDifference(measurements.cfpC, measurements.cfpBg)
    }</p>`;
}

    
if (measurements.esatT && measurements.esatBg) {
  differenceText +=
    `<p>ESAT-6 T선과 배경 RGB 차이: ${
      rgbDifference(measurements.esatT, measurements.esatBg)
    }</p>`;
}

if (measurements.cfpT && measurements.cfpBg) {
  differenceText +=
    `<p>CFP-10 T선과 배경 RGB 차이: ${
      rgbDifference(measurements.cfpT, measurements.cfpBg)
    }</p>`;
}


document.getElementById("regionResults").innerHTML =
  Object.entries(measurements)
    .map(([key, rgb]) =>
      `<p>${regionNames[key]}: RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`
    )
    .join("") + differenceText;
  });


document.getElementById("autoMeasureBtn")
  .addEventListener("click", measureColorPatches);


document.getElementById("startCameraBtn")
  .addEventListener("click", async function() {
    try {
      const video = document.getElementById("cameraPreview");

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      document.getElementById("status").textContent =
        "카메라 실행 중";

    } catch (error) {
      alert("카메라를 실행할 수 없습니다: " + error.message);
    }
  });



document.getElementById("captureBtn")
  .addEventListener("click", function() {
    const video = document.getElementById("cameraPreview");

    if (!video.videoWidth || !video.videoHeight) {
      alert("먼저 카메라를 켜주세요.");
      return;
    }

   

const guide = document.getElementById("cameraGuide");

const videoRect = video.getBoundingClientRect();
const guideRect = guide.getBoundingClientRect();

const videoWidth = video.videoWidth;
const videoHeight = video.videoHeight;

// 화면에 표시된 실제 영상 크기 계산
const displayedWidth = videoRect.width;
const displayedHeight = videoRect.height;

const videoRatio = videoWidth / videoHeight;
const displayRatio = displayedWidth / displayedHeight;

let contentWidth, contentHeight;
let offsetX = 0, offsetY = 0;

if (videoRatio > displayRatio) {
  contentWidth = displayedWidth;
  contentHeight = displayedWidth / videoRatio;
  offsetY = (displayedHeight - contentHeight) / 2;
} else {
  contentHeight = displayedHeight;
  contentWidth = displayedHeight * videoRatio;
  offsetX = (displayedWidth - contentWidth) / 2;
}

// 가이드라인과 실제 영상이 겹치는 영역
const left = Math.max(
  0, guideRect.left - videoRect.left - offsetX
);
const top = Math.max(
  0, guideRect.top - videoRect.top - offsetY
);

const right = Math.min(
  contentWidth,
  guideRect.right - videoRect.left - offsetX
);
const bottom = Math.min(
  contentHeight,
  guideRect.bottom - videoRect.top - offsetY
);

if (right <= left || bottom <= top) {
  alert("가이드라인 안에 카메라 영상이 없습니다.");
  return;
}

// 화면 좌표를 원본 영상 좌표로 변환
const cropX = Math.round(left / contentWidth * videoWidth);
const cropY = Math.round(top / contentHeight * videoHeight);
const cropWidth = Math.round(
  (right - left) / contentWidth * videoWidth
);
const cropHeight = Math.round(
  (bottom - top) / contentHeight * videoHeight
);

canvas.width = cropWidth;
canvas.height = cropHeight;

ctx.drawImage(
  video,
  cropX, cropY, cropWidth, cropHeight,
  0, 0, cropWidth, cropHeight
);



    const photoURL = canvas.toDataURL("image/png");

    preview.onload = function() {
      document.getElementById("status").textContent =
        "사진 촬영 완료";

      document.getElementById("autoMeasureBtn").disabled = false;
    };

    preview.src = photoURL;

    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    Object.keys(measurements).forEach(
      key => delete measurements[key]
    );

    Object.keys(regionPositions).forEach(
      key => delete regionPositions[key]
    );

    document.getElementById("regionResults").textContent =
      "아직 측정된 영역이 없습니다.";

    document.getElementById("rgbResult").textContent =
      "RGB: 측정 대기 중";
  });


document.getElementById("detectKitBtn")
  .addEventListener("click", function () {

    if (!preview.complete || !preview.naturalWidth) {
      alert("먼저 키트 사진을 촬영해주세요.");
      return;
    }

    const w = preview.naturalWidth;
    const h = preview.naturalHeight;

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(preview, 0, 0, w, h);

    const pixels = ctx.getImageData(0, 0, w, h).data;


const step = 3;
const cols = Math.ceil(w / step);
const rows = Math.ceil(h / step);

const mask = new Uint8Array(cols * rows);
const visited = new Uint8Array(cols * rows);

// 흰색 키트 후보 픽셀 분류
for (let gy = 0; gy < rows; gy++) {
  for (let gx = 0; gx < cols; gx++) {
    const x = Math.min(gx * step, w - 1);
    const y = Math.min(gy * step, h - 1);
    const i = (y * w + x) * 4;

    const r = pixels[i];
    const g = pixels[i + 1];
    const b = pixels[i + 2];

    const min = Math.min(r, g, b);
    const max = Math.max(r, g, b);

    if (min > 170 && max - min < 30) {
      mask[gy * cols + gx] = 1;
    }
  }
}

let best = null;

// 서로 연결된 흰색 영역 탐색
for (let start = 0; start < mask.length; start++) {
  if (!mask[start] || visited[start]) continue;

  const queue = [start];
  visited[start] = 1;

  let head = 0;
  let count = 0;
  let left = cols, right = 0;
  let top = rows, bottom = 0;

  while (head < queue.length) {
    const id = queue[head++];
    const x = id % cols;
    const y = Math.floor(id / cols);

    count++;
    left = Math.min(left, x);
    right = Math.max(right, x);
    top = Math.min(top, y);
    bottom = Math.max(bottom, y);

    const neighbors = [
      x > 0 ? id - 1 : -1,
      x < cols - 1 ? id + 1 : -1,
      y > 0 ? id - cols : -1,
      y < rows - 1 ? id + cols : -1
    ];

    for (const next of neighbors) {
      if (next < 0 || visited[next] || !mask[next]) continue;
      visited[next] = 1;
      queue.push(next);
    }
  }

  const bw = right - left + 1;
  const bh = bottom - top + 1;
  const ratio = Math.max(bw, bh) / Math.max(1, Math.min(bw, bh));

  // 길쭉한 키트 형태의 영역 우선
if (
  count > 30 &&
  ratio > 3 &&
  ratio < 15 &&
  bw > 20 &&
  bh > 5
) {
    const score = count * Math.min(ratio, 12);

    if (!best || score > best.score) {
      best = { left, right, top, bottom, score };
    }
  }
}

let minX = w, minY = h;
let maxX = -1, maxY = -1;

if (best) {
  minX = best.left * step;
  minY = best.top * step;
  maxX = Math.min(w - 1, (best.right + 1) * step);
  maxY = Math.min(h - 1, (best.bottom + 1) * step);
}

    if (maxX < 0) {
      document.getElementById("detectKitResult")
        .textContent = "키트 후보를 찾지 못했습니다.";
      return;
    }
    
detectedKit = {
  x: minX,
  y: minY,
  width: maxX - minX,
  height: maxY - minY
};
    const box = document.getElementById("selectionBox");
    const scaleX = preview.clientWidth / w;
    const scaleY = preview.clientHeight / h;

    box.style.left = (minX * scaleX) + "px";
    box.style.top = (minY * scaleY) + "px";
    box.style.width = ((maxX - minX) * scaleX) + "px";
    box.style.height = ((maxY - minY) * scaleY) + "px";
    box.style.display = "block";

    document.getElementById("detectKitResult")
      .textContent = "키트 후보 영역을 표시했습니다.";
  });


function measureColorPatches() {
  if (!detectedKit) {
    alert("먼저 키트 위치 자동 인식을 실행해주세요.");
    return;
  }

  const w = preview.naturalWidth;
  const h = preview.naturalHeight;

  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(preview, 0, 0, w, h);

  // 키트 왼쪽 색상 패치의 임시 상대 좌표
const patches = [
  { key: "refR", x: 0.065 },
  { key: "refG", x: 0.115 },
  { key: "refB", x: 0.165 },
  { key: "refK", x: 0.215 },
  { key: "refW", x: 0.265 }
];

  const markerLayer = document.getElementById("patchMarkers");
markerLayer.innerHTML = "";
  for (const patch of patches) {
    const x = Math.round(
      detectedKit.x + detectedKit.width * patch.x
    );

    const y = Math.round(
      detectedKit.y + detectedKit.height * 0.50
    );

    
const marker = document.createElement("div");

const scaleX = preview.clientWidth / w;
const scaleY = preview.clientHeight / h;

marker.style.position = "absolute";
marker.style.left = (x * scaleX) + "px";
marker.style.top = (y * scaleY) + "px";
marker.style.width = "10px";
marker.style.height = "10px";
marker.style.borderRadius = "50%";
marker.style.background = "#FFEB3B";
marker.style.border = "2px solid #222";
marker.style.transform = "translate(-50%, -50%)";
marker.style.boxSizing = "border-box";

markerLayer.appendChild(marker);

    const size = Math.max(
      4,
      Math.round(detectedKit.height * 0.12)
    );

    const startX = Math.max(0, x - Math.floor(size / 2));
    const startY = Math.max(0, y - Math.floor(size / 2));

    const width = Math.min(size, w - startX);
    const height = Math.min(size, h - startY);

    const pixels = ctx.getImageData(
      startX, startY, width, height
    ).data;

    let r = 0, g = 0, b = 0;
    const count = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
      r += pixels[i];
      g += pixels[i + 1];
      b += pixels[i + 2];
    }

    measurements[patch.key] = {
      r: Math.round(r / count),
      g: Math.round(g / count),
      b: Math.round(b / count)
    };
  }

  const names = {
    refR: "빨강",
    refG: "초록",
    refB: "파랑",
    refK: "검정",
    refW: "흰색"
  };

  document.getElementById("regionResults").innerHTML =
    patches.map(p => {
      const rgb = measurements[p.key];
      return `<p>패치 - ${names[p.key]}:
        RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`;
    }).join("");

  document.getElementById("status").textContent =
    "색상 패치 5개 자동 측정 완료";
}

  
</script>
</body>
</html>

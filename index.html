<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TBiCUE RGB Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #F5F7F7;
      color: #333333;
    }

    h2 {
      color: #168B90;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
#startCameraBtn {
  display: none !important;
}
  </style>

</head>
<body>
  <p id="status" style="display:none;"></p>
 


<input type="file" id="imageInput" accept="image/*" style="display:none;">


<div style="
  position:relative;
  width:100%;
  max-width:500px;
  margin:auto;
  overflow:hidden;
  border-radius:12px;
  background:#222;
">
  

<video id="cameraPreview"
  autoplay
  playsinline
  muted
style="
  display:block;
  width:100%;
  height:180px;
  object-fit:cover;
  background:#222;
"
></video>

<div
  id="cameraGuide"
  style="
    position:absolute;
    left:3%;
top:30%;
width:94%;
height:40%;
    border:3px dashed #168B90;
    border-radius:10px;
    box-sizing:border-box;
    pointer-events:none;
  "
></div>

</div>



<button id="captureBtn" type="button">
  사진 촬영
</button>
 

  
<br><br>


<div id="imageWrapper" style="
  position:relative;
  display:none;
  width:fit-content;
  max-width:100%;
">
  <img id="preview" style="
    display:block;
    max-width:100%;
    height:auto;
  ">

  <div id="selectionBox" style="
    position:absolute;
    border:2px solid #168B90;
    box-sizing:border-box;
    pointer-events:none;
    display:none;
  "></div>
  
<div
  id="patchMarkers"
  style="
    position:absolute;
    inset:0;
    pointer-events:none;
  "
></div>

</div>


<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");

  imageInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;
    Object.keys(measurements).forEach(key => delete measurements[key]);
document.getElementById("regionResults").textContent =
  "아직 측정된 영역이 없습니다.";

    const imageURL = URL.createObjectURL(file);

preview.onload = function() {
  URL.revokeObjectURL(imageURL);



  document.getElementById("status").textContent =
    "이미지 불러오기 완료";
};

    preview.src = imageURL;
    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    document.getElementById("status").textContent =
      "이미지 불러오기 완료";
  });
</script>

<div id="regionResults" style="display:none;"></div>


<canvas id="imageCanvas" style="display:none;"></canvas>

<script>
  const canvas = document.getElementById("imageCanvas");
  const ctx = canvas.getContext("2d");
  const measurements = {};
  const regionPositions = {};
  let detectedKit = null;

async function startCamera() {
    try {
      const video = document.getElementById("cameraPreview");

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      document.getElementById("status").textContent =
        "카메라 실행 중";

    } catch (error) {
      alert("카메라를 실행할 수 없습니다: " + error.message);
    }
  }


  

function capturePhoto() {
    const video = document.getElementById("cameraPreview");

    if (!video.videoWidth || !video.videoHeight) {
      alert("먼저 카메라를 켜주세요.");
      return;
    }

   

const guide = document.getElementById("cameraGuide");

const videoRect = video.getBoundingClientRect();
const guideRect = guide.getBoundingClientRect();

const videoWidth = video.videoWidth;
const videoHeight = video.videoHeight;

// 화면에 표시된 실제 영상 크기 계산
const displayedWidth = videoRect.width;
const displayedHeight = videoRect.height;

const videoRatio = videoWidth / videoHeight;
const displayRatio = displayedWidth / displayedHeight;

let contentWidth, contentHeight;
let offsetX = 0, offsetY = 0;

if (videoRatio > displayRatio) {
  contentWidth = displayedWidth;
  contentHeight = displayedWidth / videoRatio;
  offsetY = (displayedHeight - contentHeight) / 2;
} else {
  contentHeight = displayedHeight;
  contentWidth = displayedHeight * videoRatio;
  offsetX = (displayedWidth - contentWidth) / 2;
}

// 가이드라인과 실제 영상이 겹치는 영역
const left = Math.max(
  0, guideRect.left - videoRect.left - offsetX
);
const top = Math.max(
  0, guideRect.top - videoRect.top - offsetY
);

const right = Math.min(
  contentWidth,
  guideRect.right - videoRect.left - offsetX
);
const bottom = Math.min(
  contentHeight,
  guideRect.bottom - videoRect.top - offsetY
);

if (right <= left || bottom <= top) {
  alert("가이드라인 안에 카메라 영상이 없습니다.");
  return;
}

// 화면 좌표를 원본 영상 좌표로 변환
const cropX = Math.round(left / contentWidth * videoWidth);
const cropY = Math.round(top / contentHeight * videoHeight);
const cropWidth = Math.round(
  (right - left) / contentWidth * videoWidth
);
const cropHeight = Math.round(
  (bottom - top) / contentHeight * videoHeight
);

canvas.width = cropWidth;
canvas.height = cropHeight;

ctx.drawImage(
  video,
  cropX, cropY, cropWidth, cropHeight,
  0, 0, cropWidth, cropHeight
);



    const photoURL = canvas.toDataURL("image/png");

   preview.onload = function() {
  document.getElementById("status").textContent =
    "키트 자동 분석 중";

  detectedKit = null;
  detectKit();

  if (!detectedKit) {
    document.getElementById("status").textContent =
      "키트 인식 실패";
    return;
  }

  measureColorPatches();
  measureTestWindows();

  document.getElementById("status").textContent =
    "분석 완료";
};
    preview.src = photoURL;

    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    Object.keys(measurements).forEach(
      key => delete measurements[key]
    );

    Object.keys(regionPositions).forEach(
      key => delete regionPositions[key]
    );

    document.getElementById("regionResults").textContent =
      "아직 측정된 영역이 없습니다.";

  }


function detectKit() {

    if (!preview.complete || !preview.naturalWidth) {
      alert("먼저 키트 사진을 촬영해주세요.");
      return;
    }

    const w = preview.naturalWidth;
    const h = preview.naturalHeight;

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(preview, 0, 0, w, h);

    const pixels = ctx.getImageData(0, 0, w, h).data;


const step = 3;
const cols = Math.ceil(w / step);
const rows = Math.ceil(h / step);

const mask = new Uint8Array(cols * rows);
const visited = new Uint8Array(cols * rows);

// 흰색 키트 후보 픽셀 분류
for (let gy = 0; gy < rows; gy++) {
  for (let gx = 0; gx < cols; gx++) {
    const x = Math.min(gx * step, w - 1);
    const y = Math.min(gy * step, h - 1);
    const i = (y * w + x) * 4;

    const r = pixels[i];
    const g = pixels[i + 1];
    const b = pixels[i + 2];

    const min = Math.min(r, g, b);
    const max = Math.max(r, g, b);

    if (min > 170 && max - min < 30) {
      mask[gy * cols + gx] = 1;
    }
  }
}

let best = null;

// 서로 연결된 흰색 영역 탐색
for (let start = 0; start < mask.length; start++) {
  if (!mask[start] || visited[start]) continue;

  const queue = [start];
  visited[start] = 1;

  let head = 0;
  let count = 0;
  let left = cols, right = 0;
  let top = rows, bottom = 0;

  while (head < queue.length) {
    const id = queue[head++];
    const x = id % cols;
    const y = Math.floor(id / cols);

    count++;
    left = Math.min(left, x);
    right = Math.max(right, x);
    top = Math.min(top, y);
    bottom = Math.max(bottom, y);

    const neighbors = [
      x > 0 ? id - 1 : -1,
      x < cols - 1 ? id + 1 : -1,
      y > 0 ? id - cols : -1,
      y < rows - 1 ? id + cols : -1
    ];

    for (const next of neighbors) {
      if (next < 0 || visited[next] || !mask[next]) continue;
      visited[next] = 1;
      queue.push(next);
    }
  }

  const bw = right - left + 1;
  const bh = bottom - top + 1;
  const ratio = Math.max(bw, bh) / Math.max(1, Math.min(bw, bh));

  // 길쭉한 키트 형태의 영역 우선
if (
  count > 30 &&
  ratio > 3 &&
  ratio < 15 &&
  bw > 20 &&
  bh > 5
) {
    const score = count * Math.min(ratio, 12);

    if (!best || score > best.score) {
      best = { left, right, top, bottom, score };
    }
  }
}

let minX = w, minY = h;
let maxX = -1, maxY = -1;

if (best) {
  minX = best.left * step;
  minY = best.top * step;
  maxX = Math.min(w - 1, (best.right + 1) * step);
  maxY = Math.min(h - 1, (best.bottom + 1) * step);
}

    if (maxX < 0) {
detectedKit = null;
return;
    }
    
detectedKit = {
  x: minX,
  y: minY,
  width: maxX - minX,
  height: maxY - minY
};
    const box = document.getElementById("selectionBox");
    const scaleX = preview.clientWidth / w;
    const scaleY = preview.clientHeight / h;

    box.style.left = (minX * scaleX) + "px";
    box.style.top = (minY * scaleY) + "px";
    box.style.width = ((maxX - minX) * scaleX) + "px";
    box.style.height = ((maxY - minY) * scaleY) + "px";
    box.style.display = "block";

}


function measureColorPatches() {
  if (!detectedKit) {
    alert("먼저 키트 위치 자동 인식을 실행해주세요.");
    return;
  }

  const w = preview.naturalWidth;
  const h = preview.naturalHeight;

  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(preview, 0, 0, w, h);

  // 키트 왼쪽 색상 패치의 임시 상대 좌표
const patches = [
  { key: "refR", x: 0.065 },
  { key: "refG", x: 0.115 },
  { key: "refB", x: 0.165 },
  { key: "refK", x: 0.215 },
  { key: "refW", x: 0.265 }
];

  const markerLayer = document.getElementById("patchMarkers");
markerLayer.innerHTML = "";
  for (const patch of patches) {
    const x = Math.round(
      detectedKit.x + detectedKit.width * patch.x
    );

    const y = Math.round(
      detectedKit.y + detectedKit.height * 0.50
    );

    
const marker = document.createElement("div");

const scaleX = preview.clientWidth / w;
const scaleY = preview.clientHeight / h;

marker.style.position = "absolute";
marker.style.left = (x * scaleX) + "px";
marker.style.top = (y * scaleY) + "px";
marker.style.width = "10px";
marker.style.height = "10px";
marker.style.borderRadius = "50%";
marker.style.background = "#FFEB3B";
marker.style.border = "1px solid #222";
marker.style.transform = "translate(-50%, -50%)";
marker.style.boxSizing = "border-box";

markerLayer.appendChild(marker);

    const size = Math.max(
      4,
      Math.round(detectedKit.height * 0.12)
    );

    const startX = Math.max(0, x - Math.floor(size / 2));
    const startY = Math.max(0, y - Math.floor(size / 2));

    const width = Math.min(size, w - startX);
    const height = Math.min(size, h - startY);

    const pixels = ctx.getImageData(
      startX, startY, width, height
    ).data;

    let r = 0, g = 0, b = 0;
    const count = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
      r += pixels[i];
      g += pixels[i + 1];
      b += pixels[i + 2];
    }

    measurements[patch.key] = {
      r: Math.round(r / count),
      g: Math.round(g / count),
      b: Math.round(b / count)
    };
  }

  const names = {
    refR: "빨강",
    refG: "초록",
    refB: "파랑",
    refK: "검정",
    refW: "흰색"
  };

  document.getElementById("regionResults").innerHTML =
    patches.map(p => {
      const rgb = measurements[p.key];
      return `<p>패치 - ${names[p.key]}:
        RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`;
    }).join("");

  document.getElementById("status").textContent =
    "색상 패치 5개 자동 측정 완료";
}

function measureTestWindows() {
  if (!detectedKit) {
    alert("먼저 키트 위치를 인식해주세요.");
    return;
  }

  const w = preview.naturalWidth;
  const h = preview.naturalHeight;

  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(preview, 0, 0, w, h);

const testPoints = [
  { key: "esatC", x: 0.49, y: 0.50 },
  { key: "esatT", x: 0.47, y: 0.50 },
  { key: "esatBg", x: 0.48, y: 0.50 },

  { key: "cfpC", x: 0.76, y: 0.50 },
  { key: "cfpT", x: 0.74, y: 0.50 },
  { key: "cfpBg", x: 0.75, y: 0.50 }
];

  for (const point of testPoints) {
    const x = Math.round(detectedKit.x + detectedKit.width * point.x);
    const y = Math.round(detectedKit.y + detectedKit.height * point.y);

    const size = Math.max(4, Math.round(detectedKit.height * 0.08));
    const sx = Math.max(0, Math.min(w - size, x - Math.floor(size / 2)));
    const sy = Math.max(0, Math.min(h - size, y - Math.floor(size / 2)));

    const pixels = ctx.getImageData(sx, sy, size, size).data;

    let r = 0, g = 0, b = 0;
    const count = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
      r += pixels[i];
      g += pixels[i + 1];
      b += pixels[i + 2];
    }

    measurements[point.key] = {
      r: Math.round(r / count),
      g: Math.round(g / count),
      b: Math.round(b / count)
    };
  }

  const names = {
    esatC: "ESAT-6 C선",
    esatT: "ESAT-6 T선",
    esatBg: "ESAT-6 배경",
    cfpC: "CFP-10 C선",
    cfpT: "CFP-10 T선",
    cfpBg: "CFP-10 배경"
  };

  const results = document.getElementById("regionResults");

  results.innerHTML += "<h4>검사창 RGB 측정값</h4>" +
    testPoints.map(point => {
      const rgb = measurements[point.key];
      return `<p>${names[point.key]}: RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`;
    }).join("");

 document.getElementById("status").textContent =
  "검사창 6개 RGB 측정 완료";
  const analysis = analyzeTBiCUE();

regionResults.innerHTML += `
  <h4>항원별 판정 결과</h4>
  <p>ESAT-6: ${analysis.esat}</p>
  <p>CFP-10: ${analysis.cfp}</p>
  <h4>최종 판정: ${analysis.result}</h4>
`;
}


function judgeTBiCUE(esatC, esatT, cfpC, cfpT) {
  // C선이 하나라도 없으면 무효
  if (!esatC || !cfpC) {
    return {
      result: "재검사",
      esat: "판정불가",
      cfp: "판정불가"
    };
  }

  const esat = esatT ? "검출" : "미검출";
  const cfp = cfpT ? "검출" : "미검출";

  let result;

  if (esatT && cfpT) {
    result = "양성";
  } else if (!esatT && !cfpT) {
    result = "음성";
  } else {
    result = "재검사";
  }

  return { result, esat, cfp };
}
  function detectLine(lineRGB, bgRGB, threshold = 20) {
  if (!lineRGB || !bgRGB) {
    return null;
  }

  const lineStrength = (lineRGB.g + lineRGB.b) / 2;
  const bgStrength = (bgRGB.g + bgRGB.b) / 2;

  return (bgStrength - lineStrength) > threshold;
}

function analyzeTBiCUE() {
  const esatC = detectLine(measurements.esatC, measurements.esatBg);
  const esatT = detectLine(measurements.esatT, measurements.esatBg);

  const cfpC = detectLine(measurements.cfpC, measurements.cfpBg);
  const cfpT = detectLine(measurements.cfpT, measurements.cfpBg);

  if ([esatC, esatT, cfpC, cfpT].includes(null)) {
    return {
      result: "재검사",
      esat: "판정불가",
      cfp: "판정불가"
    };
  }

  return judgeTBiCUE(esatC, esatT, cfpC, cfpT);
}

function testTBiCUE(type) {
  let esatC = true;
  let esatT = false;
  let cfpC = true;
  let cfpT = false;

  if (type === "positive") {
    esatT = true;
    cfpT = true;
  } else if (type === "discordant") {
    esatT = true;
  } else if (type === "invalid") {
    esatC = false;
  }

  const analysis = judgeTBiCUE(esatC, esatT, cfpC, cfpT);

  document.getElementById("testResult").innerHTML = `
    <h4>테스트 결과</h4>
    <p>ESAT-6: ${analysis.esat}</p>
    <p>CFP-10: ${analysis.cfp}</p>
    <p><strong>최종 판정: ${analysis.result}</strong></p>
  `;
}

document.addEventListener("message", function(event) {
  if (event.data === "capture") {
    capturePhoto();
  }
});

window.addEventListener("message", function(event) {
  if (event.data === "capture") {
    capturePhoto();
  }
});
window.addEventListener("load", startCamera);

  
</script>
</body>
</html>

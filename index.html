<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TBiCUE RGB Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #F5F7F7;
      color: #333333;
    }

    h2 {
      color: #168B90;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>TBiCUE RGB Analyzer</h2>
    <p>검사 이미지 분석 시스템</p>
    <p id="status">분석 대기 중</p>
  </div>


<input type="file" id="imageInput" accept="image/*">

<br><br>


<div id="imageWrapper" style="
  position:relative;
  display:none;
  width:fit-content;
  max-width:100%;
">
  <img id="preview" style="
    display:block;
    max-width:100%;
    height:auto;
  ">

  <div id="selectionBox" style="
    position:absolute;
    border:2px solid #168B90;
    box-sizing:border-box;
    pointer-events:none;
    display:none;
  "></div>
</div>


<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");

  imageInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;
    Object.keys(measurements).forEach(key => delete measurements[key]);
document.getElementById("regionResults").textContent =
  "아직 측정된 영역이 없습니다.";

    const imageURL = URL.createObjectURL(file);

preview.onload = function() {
  URL.revokeObjectURL(imageURL);

  document.getElementById("status").textContent =
    "이미지 불러오기 완료";
};

    preview.src = imageURL;
    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    document.getElementById("status").textContent =
      "이미지 불러오기 완료";
  });
</script>



<h3>측정 영역 선택</h3>

<select id="regionSelect">
  
<option value="refR">패치 - 빨강</option>
<option value="refG">패치 - 초록</option>
<option value="refB">패치 - 파랑</option>
<option value="refK">패치 - 검정</option>
<option value="refW">패치 - 흰색</option>

  <option value="esatC">ESAT-6 C선</option>
  <option value="esatT">ESAT-6 T선</option>
  <option value="esatBg">ESAT-6 배경</option>
  <option value="cfpC">CFP-10 C선</option>
  <option value="cfpT">CFP-10 T선</option>
  <option value="cfpBg">CFP-10 배경</option>
</select>

<h3>영역별 RGB 측정값</h3>
<div id="regionResults">
  아직 측정된 영역이 없습니다.
</div>

<p>사진을 클릭하면 해당 위치의 RGB 값이 표시됩니다.</p>
<p id="rgbResult">RGB: 측정 대기 중</p>

<canvas id="imageCanvas" style="display:none;"></canvas>

<script>
  const canvas = document.getElementById("imageCanvas");
  const ctx = canvas.getContext("2d");
  const measurements = {};

  preview.addEventListener("click", function(event) {
    const rect = preview.getBoundingClientRect();

    const x = Math.floor(
      (event.clientX - rect.left) *
      preview.naturalWidth / rect.width
    );

    const y = Math.floor(
      (event.clientY - rect.top) *
      preview.naturalHeight / rect.height
    );

    canvas.width = preview.naturalWidth;
    canvas.height = preview.naturalHeight;

    ctx.drawImage(preview, 0, 0);

   

const size = 20;

// 클릭한 위치를 중심으로 측정 영역 설정
const startX = Math.max(
  0, Math.min(x - size / 2, canvas.width - size)
);

const startY = Math.max(
  0, Math.min(y - size / 2, canvas.height - size)
);

// 측정 영역의 가로, 세로 크기
const width = Math.min(size, canvas.width);
const height = Math.min(size, canvas.height);



const selectionBox = document.getElementById("selectionBox");

const scaleX = preview.clientWidth / canvas.width;
const scaleY = preview.clientHeight / canvas.height;

selectionBox.style.left = (startX * scaleX) + "px";
selectionBox.style.top = (startY * scaleY) + "px";
selectionBox.style.width = (width * scaleX) + "px";
selectionBox.style.height = (height * scaleY) + "px";

selectionBox.style.display = "block";


// 영역 내 픽셀 데이터 가져오기
const imageData = ctx.getImageData(
  startX, startY, width, height
);

const pixels = imageData.data;

let totalR = 0;
let totalG = 0;
let totalB = 0;
let count = 0;

// 각 픽셀의 RGB 합산
for (let i = 0; i < pixels.length; i += 4) {
  totalR += pixels[i];
  totalG += pixels[i + 1];
  totalB += pixels[i + 2];
  count++;
}

// 평균 RGB 계산
const avgR = Math.round(totalR / count);
const avgG = Math.round(totalG / count);
const avgB = Math.round(totalB / count);

// 결과 표시

const region = document.getElementById("regionSelect").value;


const regionNames = {
  refR: "패치 - 빨강",
  refG: "패치 - 초록",
  refB: "패치 - 파랑",
  refK: "패치 - 검정",
  refW: "패치 - 흰색",

  esatC: "ESAT-6 C선",
  esatT: "ESAT-6 T선",
  esatBg: "ESAT-6 배경",
  cfpC: "CFP-10 C선",
  cfpT: "CFP-10 T선",
  cfpBg: "CFP-10 배경"
};

measurements[region] = {
  r: avgR,
  g: avgG,
  b: avgB
};

document.getElementById("regionResults").innerHTML =
  Object.entries(measurements)
    .map(([key, rgb]) =>
      `<p>${regionNames[key]}: RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`
    )
    .join("");

  });
</script>
</body>
</html>

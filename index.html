<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TBiCUE RGB Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #F5F7F7;
      color: #333333;
    }

    h2 {
      color: #168B90;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>TBiCUE RGB Analyzer</h2>
    <p>검사 이미지 분석 시스템</p>
    <p id="status">분석 대기 중</p>
  </div>
</body>
</html>

<p id="status">분석 대기 중</p>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<img id="preview"
     style="max-width:100%; display:none;">

<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");

  imageInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    preview.onload = function() {
      URL.revokeObjectURL(imageURL);
    };

    preview.src = imageURL;
    preview.style.display = "block";

    document.getElementById("status").textContent =
      "이미지 불러오기 완료";
  });
</script>


<h3>RGB 분석 결과</h3>
<p>사진을 클릭하면 해당 위치의 RGB 값이 표시됩니다.</p>
<p id="rgbResult">RGB: 측정 대기 중</p>

<canvas id="imageCanvas" style="display:none;"></canvas>

<script>
  const canvas = document.getElementById("imageCanvas");
  const ctx = canvas.getContext("2d");

  preview.addEventListener("click", function(event) {
    const rect = preview.getBoundingClientRect();

    const x = Math.floor(
      (event.clientX - rect.left) *
      preview.naturalWidth / rect.width
    );

    const y = Math.floor(
      (event.clientY - rect.top) *
      preview.naturalHeight / rect.height
    );

    canvas.width = preview.naturalWidth;
    canvas.height = preview.naturalHeight;

    ctx.drawImage(preview, 0, 0);

    const pixel = ctx.getImageData(x, y, 1, 1).data;

    document.getElementById("rgbResult").textContent =
      `RGB: (${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
  });
</script>

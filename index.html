<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TBiCUE RGB Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #F5F7F7;
      color: #333333;
    }

    h2 {
      color: #168B90;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>TBiCUE RGB Analyzer</h2>
    <p>검사 이미지 분석 시스템</p>
    <p id="status">분석 대기 중</p>
  </div>


<input type="file" id="imageInput" accept="image/*">

<h3>키트 촬영</h3>

<div style="
  position:relative;
  width:100%;
  max-width:500px;
  margin:auto;
  overflow:hidden;
  border-radius:12px;
  background:#222;
">
  
<video
  id="cameraPreview"
  autoplay
  playsinline
  muted
  style="display:block;width:100%;"
></video>


  <div style="
    position:absolute;
   left:5%;
top:25%;
width:90%;
height:50%;
    border:3px dashed #168B90;
    border-radius:10px;
    box-sizing:border-box;
    pointer-events:none;
  "></div>
</div>

<p style="text-align:center;">
  키트를 가이드라인 안에 맞춰주세요.
</p>

<button id="startCameraBtn" type="button">
  카메라 켜기
</button>
 
<button id="captureBtn" type="button">
  사진 촬영
</button>
 

  
<br><br>


<div id="imageWrapper" style="
  position:relative;
  display:none;
  width:fit-content;
  max-width:100%;
">
  <img id="preview" style="
    display:block;
    max-width:100%;
    height:auto;
  ">

  <div id="selectionBox" style="
    position:absolute;
    border:2px solid #168B90;
    box-sizing:border-box;
    pointer-events:none;
    display:none;
  "></div>
</div>


<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");

  imageInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;
    Object.keys(measurements).forEach(key => delete measurements[key]);
document.getElementById("regionResults").textContent =
  "아직 측정된 영역이 없습니다.";

    const imageURL = URL.createObjectURL(file);

preview.onload = function() {
  URL.revokeObjectURL(imageURL);

  document.getElementById("autoMeasureBtn").disabled = false;

  document.getElementById("status").textContent =
    "이미지 불러오기 완료";
};

    preview.src = imageURL;
    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    document.getElementById("status").textContent =
      "이미지 불러오기 완료";
  });
</script>



<button id="autoMeasureBtn" type="button" >
  RGB 자동 측정
</button>
  <button id="detectKitBtn" type="button">
  키트 위치 자동 인식
</button>
<p id="detectKitResult">키트 인식 대기 중</p>

<h3>측정 영역 선택</h3>

<select id="regionSelect">
  
<option value="refR">패치 - 빨강</option>
<option value="refG">패치 - 초록</option>
<option value="refB">패치 - 파랑</option>
<option value="refK">패치 - 검정</option>
<option value="refW">패치 - 흰색</option>

  <option value="esatC">ESAT-6 C선</option>
  <option value="esatT">ESAT-6 T선</option>
  <option value="esatBg">ESAT-6 배경</option>
  <option value="cfpC">CFP-10 C선</option>
  <option value="cfpT">CFP-10 T선</option>
  <option value="cfpBg">CFP-10 배경</option>
</select>

<h3>영역별 RGB 측정값</h3>
<div id="regionResults">
  아직 측정된 영역이 없습니다.
</div>

<p>사진을 클릭하면 해당 위치의 RGB 값이 표시됩니다.</p>
<p id="rgbResult">RGB: 측정 대기 중</p>

<canvas id="imageCanvas" style="display:none;"></canvas>

<script>
  const canvas = document.getElementById("imageCanvas");
  const ctx = canvas.getContext("2d");
  const measurements = {};
  const regionPositions = {};

  preview.addEventListener("click", function(event) {
    const rect = preview.getBoundingClientRect();

    const x = Math.floor(
      (event.clientX - rect.left) *
      preview.naturalWidth / rect.width
    );

    const y = Math.floor(
      (event.clientY - rect.top) *
      preview.naturalHeight / rect.height
    );

    canvas.width = preview.naturalWidth;
    canvas.height = preview.naturalHeight;

    ctx.drawImage(preview, 0, 0);

   

const size = 20;

// 클릭한 위치를 중심으로 측정 영역 설정
const startX = Math.max(
  0, Math.min(x - size / 2, canvas.width - size)
);

const startY = Math.max(
  0, Math.min(y - size / 2, canvas.height - size)
);

// 측정 영역의 가로, 세로 크기
const width = Math.min(size, canvas.width);
const height = Math.min(size, canvas.height);



const selectionBox = document.getElementById("selectionBox");

const scaleX = preview.clientWidth / canvas.width;
const scaleY = preview.clientHeight / canvas.height;

selectionBox.style.left = (startX * scaleX) + "px";
selectionBox.style.top = (startY * scaleY) + "px";
selectionBox.style.width = (width * scaleX) + "px";
selectionBox.style.height = (height * scaleY) + "px";

selectionBox.style.display = "block";


// 영역 내 픽셀 데이터 가져오기
const imageData = ctx.getImageData(
  startX, startY, width, height
);

const pixels = imageData.data;

let totalR = 0;
let totalG = 0;
let totalB = 0;
let count = 0;

// 각 픽셀의 RGB 합산
for (let i = 0; i < pixels.length; i += 4) {
  totalR += pixels[i];
  totalG += pixels[i + 1];
  totalB += pixels[i + 2];
  count++;
}

// 평균 RGB 계산
const avgR = Math.round(totalR / count);
const avgG = Math.round(totalG / count);
const avgB = Math.round(totalB / count);

// 결과 표시

const region = document.getElementById("regionSelect").value;


const regionNames = {
  refR: "패치 - 빨강",
  refG: "패치 - 초록",
  refB: "패치 - 파랑",
  refK: "패치 - 검정",
  refW: "패치 - 흰색",

  esatC: "ESAT-6 C선",
  esatT: "ESAT-6 T선",
  esatBg: "ESAT-6 배경",
  cfpC: "CFP-10 C선",
  cfpT: "CFP-10 T선",
  cfpBg: "CFP-10 배경"
};

measurements[region] = {
  r: avgR,
  g: avgG,
  b: avgB
};
    regionPositions[region] = {
  x: x / canvas.width,
  y: y / canvas.height
};

function rgbDifference(a, b) {
  return Math.sqrt(
    (a.r - b.r) ** 2 +
    (a.g - b.g) ** 2 +
    (a.b - b.b) ** 2
  ).toFixed(2);
}

let differenceText = "";

if (measurements.esatC && measurements.esatBg) {
  differenceText +=
    `<p>ESAT-6 C선과 배경 RGB 차이: ${
      rgbDifference(measurements.esatC, measurements.esatBg)
    }</p>`;
}

if (measurements.cfpC && measurements.cfpBg) {
  differenceText +=
    `<p>CFP-10 C선과 배경 RGB 차이: ${
      rgbDifference(measurements.cfpC, measurements.cfpBg)
    }</p>`;
}

    
if (measurements.esatT && measurements.esatBg) {
  differenceText +=
    `<p>ESAT-6 T선과 배경 RGB 차이: ${
      rgbDifference(measurements.esatT, measurements.esatBg)
    }</p>`;
}

if (measurements.cfpT && measurements.cfpBg) {
  differenceText +=
    `<p>CFP-10 T선과 배경 RGB 차이: ${
      rgbDifference(measurements.cfpT, measurements.cfpBg)
    }</p>`;
}


document.getElementById("regionResults").innerHTML =
  Object.entries(measurements)
    .map(([key, rgb]) =>
      `<p>${regionNames[key]}: RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`
    )
    .join("") + differenceText;
  });

document.getElementById("autoMeasureBtn").addEventListener("click", function() {
  if (!preview.complete || !preview.naturalWidth) {
    alert("먼저 이미지를 업로드해 주세요.");
    return;
  }

  const regions = Object.keys(regionPositions);

  if (regions.length === 0) {
    alert("먼저 측정 영역을 클릭해서 좌표를 저장해 주세요.");
    return;
  }

  canvas.width = preview.naturalWidth;
  canvas.height = preview.naturalHeight;
  ctx.drawImage(preview, 0, 0);

  const size = 20;

  for (const region of regions) {
    const pos = regionPositions[region];

    const width = Math.min(size, canvas.width);
    const height = Math.min(size, canvas.height);

    const startX = Math.max(0, Math.min(
      Math.floor(pos.x * canvas.width - width / 2),
      canvas.width - width
    ));

    const startY = Math.max(0, Math.min(
      Math.floor(pos.y * canvas.height - height / 2),
      canvas.height - height
    ));

    const pixels = ctx.getImageData(
      startX, startY, width, height
    ).data;

    let r = 0, g = 0, b = 0;

    for (let i = 0; i < pixels.length; i += 4) {
      r += pixels[i];
      g += pixels[i + 1];
      b += pixels[i + 2];
    }

    const count = pixels.length / 4;

    measurements[region] = {
      r: Math.round(r / count),
      g: Math.round(g / count),
      b: Math.round(b / count)
    };
  }

  document.getElementById("regionResults").innerHTML =
    Object.entries(measurements)
      .map(([key, rgb]) =>
        `<p>${key}: RGB(${rgb.r}, ${rgb.g}, ${rgb.b})</p>`
      )
      .join("");

  document.getElementById("status").textContent =
    "RGB 자동 측정 완료";
});


document.getElementById("startCameraBtn")
  .addEventListener("click", async function() {
    try {
const stream = await navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" },
  audio: false
});

      const video = document.getElementById("cameraPreview");
      video.srcObject = stream;
      await video.play();

      document.getElementById("status").textContent =
        "카메라 실행 중";
    } catch (error) {
      alert("카메라를 실행할 수 없습니다: " + error.message);
    }
  });


document.getElementById("captureBtn")
  .addEventListener("click", function() {
    const video = document.getElementById("cameraPreview");

    if (!video.videoWidth || !video.videoHeight) {
      alert("먼저 카메라를 켜주세요.");
      return;
    }

   
const videoWidth = video.videoWidth;
const videoHeight = video.videoHeight;

// 가이드라인 영역: 좌우 5%, 위 25%, 높이 50%
const cropX = Math.round(videoWidth * 0.05);
const cropY = Math.round(videoHeight * 0.25);
const cropWidth = Math.round(videoWidth * 0.90);
const cropHeight = Math.round(videoHeight * 0.50);

// 잘라낸 영역 크기로 캔버스 설정
canvas.width = cropWidth;
canvas.height = cropHeight;

// 가이드라인 안쪽 영역만 추출
ctx.drawImage(
  video,
  cropX, cropY, cropWidth, cropHeight,
  0, 0, cropWidth, cropHeight
);


    const photoURL = canvas.toDataURL("image/png");

    preview.onload = function() {
      document.getElementById("status").textContent =
        "사진 촬영 완료";

      document.getElementById("autoMeasureBtn").disabled = false;
    };

    preview.src = photoURL;

    document.getElementById("imageWrapper").style.display = "block";
    document.getElementById("selectionBox").style.display = "none";

    Object.keys(measurements).forEach(
      key => delete measurements[key]
    );

    Object.keys(regionPositions).forEach(
      key => delete regionPositions[key]
    );

    document.getElementById("regionResults").textContent =
      "아직 측정된 영역이 없습니다.";

    document.getElementById("rgbResult").textContent =
      "RGB: 측정 대기 중";
  });


document.getElementById("detectKitBtn")
  .addEventListener("click", function () {

    if (!preview.complete || !preview.naturalWidth) {
      alert("먼저 키트 사진을 촬영해주세요.");
      return;
    }

    const w = preview.naturalWidth;
    const h = preview.naturalHeight;

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(preview, 0, 0, w, h);

    const pixels = ctx.getImageData(0, 0, w, h).data;

    let minX = w, minY = h;
    let maxX = -1, maxY = -1;

    for (let y = 0; y < h; y += 3) {
      for (let x = 0; x < w; x += 3) {

        const i = (y * w + x) * 4;
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        // 밝고 채도가 낮은 흰색 영역 후보
        const brightness = (r + g + b) / 3;
        const difference =
          Math.max(r, g, b) - Math.min(r, g, b);

        if (brightness > 175 && difference < 35) {
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }
    }

    if (maxX < 0) {
      document.getElementById("detectKitResult")
        .textContent = "키트 후보를 찾지 못했습니다.";
      return;
    }

    const box = document.getElementById("selectionBox");
    const scaleX = preview.clientWidth / w;
    const scaleY = preview.clientHeight / h;

    box.style.left = (minX * scaleX) + "px";
    box.style.top = (minY * scaleY) + "px";
    box.style.width = ((maxX - minX) * scaleX) + "px";
    box.style.height = ((maxY - minY) * scaleY) + "px";
    box.style.display = "block";

    document.getElementById("detectKitResult")
      .textContent = "키트 후보 영역을 표시했습니다.";
  });

</script>
</body>
</html>
